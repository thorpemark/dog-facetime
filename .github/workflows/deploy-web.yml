name: Deploy Web App to GitHub Pages

# Primary CI for this repo — deploys web/ to https://thorpemark.github.io/dog-facetime/
# Workflow must exist on the default branch (main) for GitHub to register it.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: web
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Verify build output
        run: |
          test -f web/dist/index.html
          test -d web/dist/clips
          test -f web/dist/keyword_rules.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
